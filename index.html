<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Dashboard</title>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>

    <input id="searchInput" type="text" placeholder="Search files..." oninput="applySearch()" />

    <select id="folderSelect" onchange="selectFolder(this.value)"></select>
    <div id="loading" class="loading">Choose a folder or search.</div>

    <div class="grid" id="musicGrid"></div>

    <div id="viewerPanel" class="viewer-panel hidden">
        <button class="viewer-close" onclick="closeViewer()">×</button>
        <div id="viewerContent"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
